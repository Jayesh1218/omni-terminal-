
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OMNI-AI · v5.0</title>
    <style>
        /* ---------- GLOBAL ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --neon: #00ffc8;
            --neon-dim: #00aa88;
            --bg-primary: #0b0f0e;
            --bg-surface: #121916;
            --bg-elevated: #1a241f;
            --border-light: #2a3f36;
            --text-primary: #d4eee6;
            --text-muted: #7a9c8f;
            --font-mono: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            --radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        html, body {
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- LAYOUT ---------- */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 20px 20px;
            gap: 14px;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .header__left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header__badge {
            background: #00ffc822;
            color: var(--neon);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            border: 1px solid #00ffc844;
        }

        .header__status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon);
        }

        .header__clock {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* ---------- MAIN GRID ---------- */
        .main-grid {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 14px;
            min-height: 0;
        }

        /* ---------- TERMINAL ---------- */
        .terminal {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-height: 0;
            overflow: hidden;
        }

        .terminal__output {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px 12px 22px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-primary);
            scroll-behavior: smooth;
        }

        .terminal__output > div {
            padding: 2px 0;
        }

        .terminal__input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-elevated);
        }

        .terminal__prompt {
            color: var(--neon);
            font-weight: 500;
            font-size: 13px;
            flex-shrink: 0;
        }

        .terminal__input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            caret-color: var(--neon);
        }

        .terminal__input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ---------- AI PANEL ---------- */
        .ai-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .ai-panel__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-panel__title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .ai-panel__status {
            font-size: 12px;
            color: var(--neon);
            background: #00ffc812;
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid #00ffc844;
        }

        .ai-panel__thought {
            background: var(--bg-elevated);
            border-radius: 8px;
            padding: 12px 16px;
            max-height: 64px;
            overflow-y: auto;
            font-size: 12px;
            color: #b8d9cf;
            line-height: 1.5;
            border: 1px solid #2a3f36;
        }

        .ai-panel__actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            touch-action: manipulation;
        }

        .btn:hover {
            background: #2a3f36;
            border-color: var(--neon-dim);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn--primary {
            background: #00ffc822;
            border-color: var(--neon);
            color: var(--neon);
        }

        .btn--primary:hover {
            background: #00ffc844;
        }

        /* ---------- WIDGETS ---------- */
        .widgets {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            overflow-x: auto;
            padding-bottom: 4px;
            scroll-snap-type: x mandatory;
        }

        .widget {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 14px 18px;
            flex: 0 0 auto;
            min-width: 160px;
            scroll-snap-align: start;
            box-shadow: var(--shadow);
        }

        .widget__title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .widget__value {
            font-size: 18px;
            font-weight: 500;
            color: var(--neon);
        }

        .widget__bar {
            margin-top: 8px;
            height: 6px;
            background: #1a2a22;
            border-radius: 20px;
            overflow: hidden;
        }

        .widget__bar-fill {
            height: 100%;
            background: var(--neon);
            border-radius: 20px;
            box-shadow: 0 0 8px var(--neon);
            transition: width 0.3s ease;
        }

        .widget__node {
            font-size: 12px;
            padding: 2px 0;
            display: flex;
            justify-content: space-between;
        }

        .widget__node-name {
            color: var(--text-muted);
        }

        .widget__node-status {
            color: var(--neon);
        }

        /* ---------- UTILITIES ---------- */
        .log-success { color: #00ffc8; }
        .log-warn { color: #ff7a5c; }
        .log-ai { color: #b8d9cf; }
        .prompt { color: #ffffffcc; }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a5a4a;
            border-radius: 20px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .app {
                padding: 10px 12px 14px 12px;
                gap: 10px;
            }
            .header {
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .header__badge {
                font-size: 9px;
                padding: 0 10px;
            }
            .terminal__output {
                padding: 14px 16px 8px 16px;
                font-size: 12px;
            }
            .terminal__input-row {
                padding: 10px 16px;
            }
            .ai-panel {
                padding: 12px 16px;
            }
            .widget {
                min-width: 130px;
                padding: 12px 14px;
            }
            .widget__value {
                font-size: 16px;
            }
            .btn {
                font-size: 10px;
                padding: 6px 14px;
            }
        }

        @media (max-width: 480px) {
            .header__left {
                gap: 6px;
                flex-wrap: wrap;
            }
            .header__status {
                font-size: 10px;
            }
            .widgets {
                gap: 8px;
            }
            .widget {
                min-width: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header__left">
                <span style="font-weight: 600; color: var(--neon);">OMNI-AI</span>
                <span class="header__badge">v5.0</span>
                <div class="header__status">
                    <span class="status-dot"></span>
                    <span id="headerStatus">MONITORING</span>
                </div>
            </div>
            <div class="header__clock" id="clock">00:00:00</div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">

            <!-- TERMINAL -->
            <div class="terminal">
                <div class="terminal__output" id="terminalLogs">
                    <div>[system] kernel loaded · omni-ai v5.0</div>
                    <div>[ai] agent status: <span class="log-success">monitoring</span></div>
                    <div>[info] type <span class="log-success">'help'</span> for commands</div>
                    <div style="margin-top: 4px;"></div>
                </div>
                <div class="terminal__input-row">
                    <span class="terminal__prompt">root@omni:~#</span>
                    <input type="text" id="cliInput" class="terminal__input" placeholder="type a command ..." autofocus>
                </div>
            </div>

            <!-- AI PANEL -->
            <div class="ai-panel">
                <div class="ai-panel__header">
                    <span class="ai-panel__title">🤖 ai agent</span>
                    <span class="ai-panel__status" id="aiStatus">MONITORING</span>
                </div>
                <div class="ai-panel__thought" id="aiThought">
                    <div>[ai] system idle · awaiting tasks</div>
                </div>
                <div class="ai-panel__actions">
                    <button class="btn btn--primary" data-cmd="ai optimize">⚡ optimize</button>
                    <button class="btn btn--primary" data-cmd="services">📡 services</button>
                    <button class="btn btn--primary" data-cmd="ai fix-errors">🛠️ auto-fix</button>
                    <button class="btn" data-cmd="auto-mode on">▶ auto-mode</button>
                </div>
            </div>

            <!-- WIDGETS -->
            <div class="widgets">
                <div class="widget">
                    <div class="widget__title">⚡ cpu</div>
                    <div class="widget__value" id="cpuVal">42%</div>
                    <div class="widget__bar">
                        <div class="widget__bar-fill" id="cpuBar" style="width:42%"></div>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget__title">💾 memory</div>
                    <div class="widget__value" id="ramVal">68%</div>
                    <div class="widget__bar">
                        <div class="widget__bar-fill" id="ramBar" style="width:68%"></div>
                    </div>
                </div>
                <div class="widget">
                    <div class="widget__title">📡 nodes</div>
                    <div class="widget__node">
                        <span class="widget__node-name">local</span>
                        <span class="widget__node-status">● online</span>
                    </div>
                    <div class="widget__node">
                        <span class="widget__node-name">gateway</span>
                        <span class="widget__node-status">● online</span>
                    </div>
                    <div class="widget__node">
                        <span class="widget__node-name">proxy</span>
                        <span class="widget__node-status" style="color:#ff7a5c;">● encrypted</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const logs = document.getElementById('terminalLogs');
            const cli = document.getElementById('cliInput');
            const aiThought = document.getElementById('aiThought');
            const aiStatusEl = document.getElementById('aiStatus');
            const headerStatus = document.getElementById('headerStatus');
            const cpuVal = document.getElementById('cpuVal');
            const cpuBar = document.getElementById('cpuBar');
            const ramVal = document.getElementById('ramVal');
            const ramBar = document.getElementById('ramBar');
            const clockEl = document.getElementById('clock');

            // ---------- state ----------
            let aiState = 'MONITORING';
            let autoMode = false;
            let autoInterval = null;

            const services = {
                firewall:    { status: 'ACTIVE' },
                db_sync:     { status: 'ACTIVE' },
                auto_backup: { status: 'ACTIVE' },
                port_monitor:{ status: 'ACTIVE' }
            };

            // ---------- helpers ----------
            function setAIStatus(status) {
                aiState = status;
                aiStatusEl.textContent = status;
                headerStatus.textContent = status;
                const colors = {
                    MONITORING: '#00ffc8',
                    THINKING:   '#ffb347',
                    EXECUTING:  '#ff7a5c'
                };
                aiStatusEl.style.color = colors[status] || '#00ffc8';
            }

            function addThought(msg, className = '') {
                const div = document.createElement('div');
                div.textContent = '[ai] ' + msg;
                if (className) div.className = className;
                aiThought.appendChild(div);
                aiThought.scrollTop = aiThought.scrollHeight;
                while (aiThought.children.length > 12) {
                    aiThought.removeChild(aiThought.firstChild);
                }
            }

            function appendLog(text, className = '') {
                const div = document.createElement('div');
                div.textContent = text;
                if (className) div.className = className;
                logs.appendChild(div);
                logs.scrollTop = logs.scrollHeight;
                if (logs.children.length > 60) {
                    logs.removeChild(logs.firstChild);
                }
            }

            // ---------- clock & telemetry ----------
            function updateTelemetry() {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString();
                const cpu = Math.floor(Math.random() * 35) + 30;
                const ram = Math.floor(Math.random() * 18) + 62;
                cpuVal.textContent = cpu + '%';
                cpuBar.style.width = cpu + '%';
                ramVal.textContent = ram + '%';
                ramBar.style.width = ram + '%';
            }
            setInterval(updateTelemetry, 2200);
            updateTelemetry();

            // ---------- AI actions ----------
            function aiOptimize() {
                setAIStatus('THINKING');
                addThought('analyzing system performance ...');
                setTimeout(() => {
                    addThought('cache cleared · memory optimized');
                    setAIStatus('EXECUTING');
                    setTimeout(() => {
                        addThought('✅ optimization complete (+14% efficiency)');
                        setAIStatus('MONITORING');
                    }, 900);
                }, 1100);
            }

            function aiFixErrors() {
                setAIStatus('THINKING');
                addThought('scanning for service failures ...');
                setTimeout(() => {
                    let fixed = false;
                    for (const [name, svc] of Object.entries(services)) {
                        if (svc.status === 'FAILED' || svc.status === 'STOPPED') {
                            svc.status = 'ACTIVE';
                            addThought(`↻ restarted ${name} → active`);
                            fixed = true;
                        }
                    }
                    if (!fixed) addThought('all services stable · no issues found');
                    setAIStatus('MONITORING');
                }, 1200);
            }

            function toggleAutoMode(on) {
                autoMode = on;
                if (on) {
                    addThought('▶ auto-mode enabled · ai will manage services');
                    if (autoInterval) clearInterval(autoInterval);
                    autoInterval = setInterval(() => {
                        const names = Object.keys(services);
                        const rand = names[Math.floor(Math.random() * names.length)];
                        if (Math.random() < 0.25 && services[rand].status === 'ACTIVE') {
                            services[rand].status = 'FAILED';
                            addThought(`⚠️ ${rand} failed · auto-fix triggered`);
                            setTimeout(() => {
                                services[rand].status = 'ACTIVE';
                                addThought(`✅ ${rand} restored`);
                            }, 1800);
                        }
                        if (Math.random() < 0.1) {
                            const s = names[Math.floor(Math.random() * names.length)];
                            if (services[s].status === 'ACTIVE') {
                                services[s].status = 'STOPPED';
                                addThought(`⏸️ ${s} paused · restarting...`);
                                setTimeout(() => {
                                    services[s].status = 'ACTIVE';
                                    addThought(`▶️ ${s} restarted`);
                                }, 2000);
                            }
                        }
                    }, 6000);
                } else {
                    if (autoInterval) clearInterval(autoInterval);
                    autoInterval = null;
                    addThought('⏹ auto-mode disabled');
                }
            }

            // ---------- command engine ----------
            function processCommand(raw) {
                const parts = raw.trim().split(/\s+/);
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1);

                if (cmd === 'help') {
                    appendLog('── available commands ──');
                    appendLog('  help              show this list');
                    appendLog('  services          list all services');
                    appendLog('  service start|stop|restart [name]');
                    appendLog('  ai status|optimize|fix-errors');
                    appendLog('  auto-mode on|off  autonomous fixes');
                    appendLog('  clear             clear terminal');
                    appendLog('  matrix            toggle matrix rain');
                }
                else if (cmd === 'services') {
                    appendLog('── service status ──');
                    for (const [name, svc] of Object.entries(services)) {
                        const cls = svc.status === 'ACTIVE' ? 'log-success' : (svc.status === 'FAILED' ? 'log-warn' : '');
                        appendLog(`  ${name}: ${svc.status}`, cls);
                    }
                }
                else if (cmd === 'service') {
                    const action = args[0]?.toLowerCase();
                    const sname = args[1]?.toLowerCase();
                    if (!action || !sname || !['start','stop','restart'].includes(action)) {
                        appendLog('usage: service start|stop|restart [name]', 'log-warn');
                        return;
                    }
                    if (!services[sname]) {
                        appendLog(`service '${sname}' not found`, 'log-warn');
                        return;
                    }
                    if (action === 'start') {
                        if (services[sname].status === 'ACTIVE') {
                            appendLog(`${sname} already active`);
                        } else {
                            services[sname].status = 'ACTIVE';
                            appendLog(`✅ ${sname} started`, 'log-success');
                        }
                    } else if (action === 'stop') {
                        if (services[sname].status === 'STOPPED') {
                            appendLog(`${sname} already stopped`);
                        } else {
                            services[sname].status = 'STOPPED';
                            appendLog(`⏸️ ${sname} stopped`, 'log-warn');
                        }
                    } else if (action === 'restart') {
                        services[sname].status = 'ACTIVE';
                        appendLog(`🔄 ${sname} restarted`, 'log-success');
                    }
                }
                else if (cmd === 'ai') {
                    const sub = args[0]?.toLowerCase();
                    if (sub === 'status') {
                        appendLog(`ai agent: ${aiState} · auto-mode: ${autoMode ? 'on' : 'off'}`);
                    } else if (sub === 'optimize') {
                        aiOptimize();
                        appendLog('[ai] optimization triggered', 'log-ai');
                    } else if (sub === 'fix-errors') {
                        aiFixErrors();
                        appendLog('[ai] error fix initiated', 'log-ai');
                    } else {
                        appendLog('ai subcommands: status, optimize, fix-errors', 'log-warn');
                    }
                }
                else if (cmd === 'auto-mode') {
                    const mode = args[0]?.toLowerCase();
                    if (mode === 'on') {
                        if (!autoMode) {
                            toggleAutoMode(true);
                            appendLog('[ai] auto-mode enabled', 'log-ai');
                        } else appendLog('auto-mode already on');
                    } else if (mode === 'off') {
                        if (autoMode) {
                            toggleAutoMode(false);
                            appendLog('[ai] auto-mode disabled', 'log-ai');
                        } else appendLog('auto-mode already off');
                    } else {
                        appendLog('usage: auto-mode on|off', 'log-warn');
                    }
                }
                else if (cmd === 'clear') {
                    logs.innerHTML = '';
                    appendLog('[terminal cleared]');
                }
                else if (cmd === 'matrix') {
                    appendLog('[matrix] rain toggled (visual only)');
                }
                else if (cmd !== '') {
                    appendLog(`unknown command: '${raw}' · type 'help'`, 'log-warn');
                }
            }

            // ---------- event bindings ----------
            cli.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const val = this.value.trim();
                    if (!val) return;
                    appendLog(`root@omni:~# ${val}`, 'prompt');
                    this.value = '';
                    processCommand(val);
                    setTimeout(() => cli.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
                }
            });

            // quick-action buttons
            document.querySelectorAll('[data-cmd]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const cmd = this.dataset.cmd;
                    if (cmd) {
                        cli.value = cmd;
                        // simulate enter
                        const event = new KeyboardEvent('keydown', { key: 'Enter' });
                        cli.dispatchEvent(event);
                    }
                    cli.focus();
                });
            });

            // focus input on tap anywhere in terminal
            document.querySelector('.terminal').addEventListener('touchstart', function(e) {
                if (e.target.tagName !== 'INPUT') cli.focus();
            }, { passive: true });

            setTimeout(() => cli.focus(), 300);

            // prevent pull-to-refresh
            document.addEventListener('touchmove', function(e) {
                const t = e.target;
                if (t.closest('.terminal__output') || t.closest('.widgets') || t.closest('.ai-panel__thought')) return;
                e.preventDefault();
            }, { passive: false });

            // ---------- auto-start demo ----------
            setTimeout(() => {
                processCommand('auto-mode on');
            }, 1800);

        })();
    </script>
</body>
</html>
